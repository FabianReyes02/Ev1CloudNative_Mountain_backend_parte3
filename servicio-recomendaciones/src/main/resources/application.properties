spring.application.name=servicio-recomendaciones

# Puerto del microservicio. Local usa 8088; el contenedor lo sobrescribe con SERVER_PORT.
server.port=${SERVER_PORT:8088}

# Origenes permitidos por CORS (separados por coma).
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Kafka: consume pedidos.creados y pagos.procesados.
# ============================================================
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
app.kafka.topic.pedidos=${KAFKA_TOPIC_PEDIDOS:pedidos.creados}
app.kafka.topic.pagos=${KAFKA_TOPIC_PAGOS:pagos.procesados}
app.kafka.group.pedidos=${KAFKA_GROUP_PEDIDOS:recomendaciones-pedidos}
app.kafka.group.pagos=${KAFKA_GROUP_PAGOS:recomendaciones-pagos}
app.kafka.listener-auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}

# ============================================================
# Catalogo de productos (HTTP). Cache de 60s.
# ============================================================
app.productos.url=${PRODUCTOS_URL:http://localhost:8081}

# Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
