spring.application.name=servicio-pagos

# Puerto del microservicio. Local usa 8087; el contenedor lo sobrescribe con SERVER_PORT.
server.port=${SERVER_PORT:8087}

# Origenes permitidos por CORS (separados por coma).
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Seguridad JWT - Azure AD / Microsoft Entra ID (opcional)
# ============================================================
app.seguridad.habilitado=${JWT_ENABLED:false}
app.seguridad.jwks-uri=${JWT_JWKS_URI:}
app.seguridad.emisor-uri=${JWT_ISSUER_URI:}
app.seguridad.audiencias=${JWT_AUDIENCES:}
app.seguridad.scopes-requeridos=${JWT_REQUIRED_SCOPES:orders.write}
app.seguridad.roles-requeridos=${JWT_REQUIRED_ROLES:}

# JWT local de la tienda (HS256, emitido por servicio-usuarios).
app.seguridad.local-habilitado=${JWT_LOCAL_ENABLED:false}
app.seguridad.local-secreto=${JWT_LOCAL_SECRET:}
app.seguridad.local-emisor=${JWT_LOCAL_ISSUER:pedidos360-usuarios}
app.seguridad.local-audiencia=${JWT_LOCAL_AUDIENCE:pedidos360-api}
app.seguridad.local-scope-requerido=${JWT_LOCAL_REQUIRED_SCOPE:orders.write}

# ============================================================
# Kafka
# ============================================================
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
app.kafka.topic.pedidos=${KAFKA_TOPIC_PEDIDOS:pedidos.creados}
app.kafka.topic.pagos=${KAFKA_TOPIC_PAGOS:pagos.procesados}
app.kafka.topic.fraude=${KAFKA_TOPIC_FRAUDE:pagos.fraude.detectado}
app.kafka.group.pedidos=${KAFKA_GROUP_PEDIDOS:pagos-pedidos}
app.kafka.listener-auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}

# ============================================================
# WebPay Plus (Transbank)
# WEBPAY_ENABLED=false -> usa WebPaySimulado (no requiere credenciales).
# ============================================================
app.webpay.habilitado=${WEBPAY_ENABLED:false}
app.webpay.entorno=${WEBPAY_ENV:INTEGRATION}
app.webpay.commerce-code=${WEBPAY_COMMERCE_CODE:}
app.webpay.api-key=${WEBPAY_API_KEY:}
app.webpay.return-url=${WEBPAY_RETURN_URL:http://localhost:8087/payments/webpay/return}
app.webpay.frontend-url=${WEBPAY_FRONTEND_URL:http://localhost:5173}

# ============================================================
# Deteccion de fraude (score 0-100)
# ============================================================
app.fraude.umbral-aprobado=${FRAUDE_UMBRAL_APROBADO:40}
app.fraude.umbral-revision=${FRAUDE_UMBRAL_REVISION:70}

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
